<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
	<!-- Google tag (gtag.js) -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-TNKV3Z810Z"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag() { dataLayer.push(arguments); }
		gtag('js', new Date());

		gtag('config', 'G-TNKV3Z810Z');
	</script>
	<script>
		// Before first paint, so a dark reader never gets a white flash.
		// No saved choice means follow the system, which the CSS does on its own.
		try {
			var t = localStorage.getItem('scooby:theme');
			if (t === 'dark' || t === 'light')
				document.documentElement.setAttribute('data-theme', t);
		} catch (e) {}
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
